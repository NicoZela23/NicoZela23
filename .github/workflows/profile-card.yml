name: Update profile card

on:
  schedule: # daily, keeps uptime + GitHub stats fresh
    - cron: "0 6 * * *"

  workflow_dispatch:

  push:
    branches:
    - main
    paths:
    - scripts/build.py
    - assets/ascii.txt
    - .github/workflows/profile-card.yml

concurrency: profile-card

jobs:
  build:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: render dark_mode.svg + light_mode.svg
        run: python scripts/build.py
        env:
          # ACCESS_TOKEN (fine-grained PAT) adds private repos to the stats; falls back to public-only
          GH_TOKEN: ${{ secrets.ACCESS_TOKEN || github.token }}

      - name: commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dark_mode.svg light_mode.svg
          git diff --cached --quiet || (git commit -m "chore: update profile card" && git push)
